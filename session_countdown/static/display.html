<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SessionCountdown Display</title><link rel="stylesheet" href="/static/common.css"><style>
body{display:grid;place-items:center;overflow:hidden}.screen{width:100vw;height:100vh;padding:4vh 5vw;display:grid;grid-template-rows:auto 1fr auto}.header{display:flex;justify-content:space-between;gap:20px}.event{font-size:clamp(28px,4vw,64px);font-weight:900}.circuit{font-size:clamp(18px,2vw,32px);color:#6ec6ff}.center{display:grid;place-items:center;text-align:center}.label{font-size:clamp(22px,3vw,48px);color:#ffd166}.session-name{font-size:clamp(40px,7vw,110px);font-weight:900}.countdown{font-variant-numeric:tabular-nums;font-size:clamp(70px,15vw,240px);font-weight:900;line-height:.9;color:#39ff14}.message{font-size:clamp(22px,3vw,50px);text-align:center;color:#ffd166;min-height:1.3em}.footer{display:flex;justify-content:space-between;font-size:clamp(16px,2vw,30px);color:#aebdca}
</style></head><body><div class="screen"><header class="header"><div><div class="event" id="event">Race Event</div><div class="circuit" id="circuit"></div></div><div id="clock"></div></header><main class="center"><div><div class="label" id="label">NEXT SESSION</div><div class="session-name" id="name">No timetable loaded</div><div class="countdown" id="countdown">--:--:--</div></div></main><div><div class="message" id="message"></div><footer class="footer"><span id="ground"></span><span id="connection">Connecting…</span></footer></div></div><script src="/static/display.js"></script></body></html>
