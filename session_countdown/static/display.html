<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SessionCountdown Display</title><link rel="stylesheet" href="/static/common.css"></head><body class="display"><div class="screen dashboard-screen"><header><div><div class="event" id="event">Race Event</div><div class="circuit" id="circuit"></div></div><div id="clock"></div></header><div class="display-grid"><main class="countdown-panel"><div class="ground-by" id="groundBy"></div><div class="eyebrow" id="eyebrow">NEXT SESSION</div><div class="action" id="action">Waiting for controller</div><div class="countdown" id="countdown">--:--:--</div><div class="sessionName" id="sessionName"></div></main><aside class="info-panel"><section class="display-card schedule-card"><div class="panel-title">SESSION SCHEDULE</div><div id="schedule" class="schedule-list"></div></section><section class="display-card weather-card"><div class="panel-title">CIRCUIT WEATHER</div><div id="weatherLocation" class="weather-location">Waiting for circuit…</div><div class="weather-main"><span id="weatherIcon">--</span><strong id="weatherTemp">--°</strong></div><div id="weatherCondition" class="weather-condition"></div><div class="weather-details"><span id="weatherHumidity">Humidity --</span><span id="weatherWind">Wind --</span><span id="weatherRain">Rain --</span></div><div id="weatherUpdated" class="weather-updated"></div></section></aside></div><footer><div id="message"></div><div id="connection">Connecting…</div></footer></div><script src="/static/display.js"></script></body></html>
