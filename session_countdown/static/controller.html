<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SessionCountdown Control</title><link rel="stylesheet" href="/static/common.css"><style>
main{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:20px}label{display:grid;gap:7px;margin:12px 0}input{width:100%;padding:11px;border-radius:9px;border:1px solid #34516a;background:#0a1620;color:white}.session{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid #29445b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#status{font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.session{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main><div class="top"><div><h1>SessionCountdown Control</h1><p class="muted">Edit the timetable on this device. The Raspberry Pi stores and runs it.</p></div><div id="status">Connecting…</div></div><div class="grid"><section class="card"><h2>Event</h2><label>Event name<input id="eventName"></label><label>Circuit<input id="circuit"></label><label>Display message<input id="message"></label><div class="actions"><button class="primary" id="save">Send timetable</button><button class="secondary" id="openDisplay">Open display</button></div></section><section class="card"><h2>Sessions</h2><div id="sessions"></div><button class="secondary" id="add">Add session</button></section></div></main><script src="/static/controller.js"></script></body></html>
