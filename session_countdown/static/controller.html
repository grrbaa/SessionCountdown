<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SessionCountdown Controller</title><link rel="stylesheet" href="/static/common.css"></head><body class="controller"><header><div><h1>SessionCountdown</h1><p>Windows Controller</p></div><div id="status" class="status">Starting…</div></header><main><section class="card"><h2>Import official schedule</h2><div class="row"><input id="pdf" type="file" accept="application/pdf"><button id="scan">Read PDF</button><select id="category"><option value="">Select category after scan</option></select><button id="rescan" class="secondary">Extract category</button></div><div id="importResult" class="import-result"></div></section><section class="card"><h2>Event setup</h2><div class="grid"><label>Event<input id="eventName"></label><label>Circuit<input id="circuit"></label><label>Category<input id="eventCategory"></label><label>Display message<input id="message"></label></div></section><section class="card"><div class="section-title"><h2>Timetable</h2><button id="add">Add session</button></div><div id="sessions"></div></section><section class="actions"><button id="save">Save and send to displays</button><button id="openDisplay" class="secondary">Display preview</button></section><section class="card"><h2>Connected displays</h2><div id="displays">No displays connected</div></section></main><script src="/static/controller.js"></script></body></html>
